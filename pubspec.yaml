name: xuefo
description: "CBETA 經典全文搜尋 Flutter App"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.11.4

dependencies:
  archive: ^4.5.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  html: ^0.15.7
  http: ^1.6.0
  icu_kit: ^0.2.0
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: CBETA Supplement
      fonts:
        - asset: assets/fonts/CBETASupplement.ttf
    - family: CBETA Siddam
      fonts:
        - asset: assets/fonts/Siddam.ttf
    - family: CBETA Ranjana
      fonts:
        - asset: assets/fonts/Ranjana.ttf
  assets:
    - assets/cbetaonline.png
    - assets/hanzi_simplified_to_traditional.json
    - assets/hanzi_traditional_to_simplified.json
    - assets/phrases_simplified_to_traditional.json
    - assets/phrases_traditional_to_simplified.json
    - assets/cbeta_catalog/category.json
    - assets/cbeta_catalog/vol.json
    - assets/cbeta_catalog/creators-by-strokes-with-works.json
    - assets/cbeta_catalog/dynasty-works.json
    - assets/cbeta_catalog/work_files.json
    - assets/fodict/030.dila-dingfubao/fodict.dat
    - assets/fodict/030.dila-dingfubao/fodict.ini
